services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aptabase
      POSTGRES_PASSWORD: aptabase_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptabase"]
      interval: 2s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:23.8.4.69
    environment:
      CLICKHOUSE_USER: aptabase
      CLICKHOUSE_PASSWORD: aptabase_pw
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  mailcatcher:
    image: dockage/mailcatcher:0.8.2
    # Only the REST API (1080) needs a host mapping, for bootstrap.go;
    # the app talks to SMTP (1025) over the internal compose network.
    # Remapped to 11080 on the host because 1080/5432/8123/1025 are
    # already bound by the separate aptabase-plus dev sandbox.
    ports: ["11080:1080"]

  aptabase-plus:
    image: ghcr.io/nmehlei/aptabase-plus:latest
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: "Server=postgres;Port=5432;User Id=aptabase;Password=aptabase_pw;Database=aptabase"
      CLICKHOUSE_URL: "Host=clickhouse;Port=8123;Username=aptabase;Password=aptabase_pw"
      AUTH_SECRET: "qjrp73j3lm3ypZgR07sC9XfviHFP9CensnwEJouYEZw="
      BASE_URL: "http://localhost:18080"
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: "noreply@example.com"
    # Remapped to 18080 on the host; 8080 is free but kept distinct
    # alongside the other remapped ports above for consistency.
    ports: ["18080:8080"]
    healthcheck:
      # The aspnet base image (Debian) has neither wget nor curl, only
      # bash - confirmed by `docker exec ... which wget` returning
      # nothing. Use bash's /dev/tcp instead of a missing HTTP client.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q '200'
      interval: 2s
      timeout: 5s
      retries: 30
